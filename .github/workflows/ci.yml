name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0-dev.1282+c0f9b51d8"
  # Verified against Zig's official minisign key before pinning this digest.
  ZIG_LINUX_SHA256: "6d81dec0152f6f11f8a12a84a73535b65070fe01b14a1ce75423870d65b3f270"

jobs:
  check:
    name: type-check (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Historical dev archives are preserved by this Zig community mirror.
      # The pinned SHA-256 below was verified against Zig's minisign key.
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          if [[ "${ZIG_VERSION}" == *"-dev."* ]]; then
            url="https://pkg.hexops.org/zig/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          else
            url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          fi
          archive="${GITHUB_WORKSPACE}/.ci/zig.tar.xz"
          install_root="${GITHUB_WORKSPACE}/.ci"
          mkdir -p "${install_root}"
          curl -fsSL "$url" -o "${archive}"
          printf '%s  %s\n' "$ZIG_LINUX_SHA256" "$archive" | sha256sum -c -
          tar -xf "${archive}" -C "${install_root}"
          test "$("${install_root}/zig-x86_64-linux-${ZIG_VERSION}/zig" version)" = "$ZIG_VERSION"
          echo "${install_root}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      # `zig build check` semantically analyses the daemon without emitting a
      # binary — the fastest signal that the tree still compiles.
      - name: Semantic check
        run: zig build check

  windows-native:
    name: native Windows full daemon
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify pinned Windows Zig
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://pkg.hexops.org/zig/zig-x86_64-windows-0.17.0-dev.1282+c0f9b51d8.zip'
          $expectedSha256 = 'DF1CA8156908BD51B417265773092DDF41A1D307F0E93B28BB3E8A0B912D0681'
          $archive = Join-Path $env:RUNNER_TEMP 'zig-pinned-windows.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'zig-pinned-windows'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Zig archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $zigExe = Get-ChildItem -LiteralPath $installRoot -Filter zig.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $zigExe) { throw 'Pinned Zig archive contains no zig.exe' }
          $actualVersion = (& $zigExe.FullName version).Trim()
          if ($actualVersion -ne $env:ZIG_VERSION) {
            throw "Zig version mismatch: expected $env:ZIG_VERSION, got $actualVersion"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $zigExe.DirectoryName
      - name: Semantic check
        run: zig build -j1 check -Dtarget=x86_64-windows --summary all
      - name: Semantic check (Windows ARM64 cross target)
        run: zig build -j1 check -Dtarget=aarch64-windows --summary all
      - name: Build (debug)
        run: zig build -j1 -Dtarget=x86_64-windows --summary all
      - name: Run focused Windows tests (Debug)
        run: zig build -j1 test-windows -Dtarget=x86_64-windows --summary all
      - name: Run focused Windows tests (ReleaseSafe)
        run: zig build -j1 test-windows -Dtarget=x86_64-windows -Doptimize=ReleaseSafe --summary all
      - name: Run Windows BoGo shim loopback tests
        run: zig build -j1 bogo-shim-test -Dtarget=x86_64-windows --summary all
      - name: Run focused Windows tests with native Zig codegen
        run: zig build -j1 test-windows -Dtarget=x86_64-windows -Dwindows-self-hosted=true --summary all
      - name: Run ReleaseSafe Windows tests with native Zig codegen
        run: zig build -j1 test-windows -Dtarget=x86_64-windows -Doptimize=ReleaseSafe -Dwindows-self-hosted=true --summary all
      - name: Build native-codegen Windows release package
        run: zig build -j1 package -Dtarget=x86_64-windows -Dwindows-self-hosted=true --prefix .\zig-out-selfhosted --summary all
      - name: Run full Windows test suite (Debug)
        run: zig build -j1 test -Dtarget=x86_64-windows --summary all
      - name: Run full Windows test suite with native Zig codegen (Debug)
        run: zig build -j1 test -Dtarget=x86_64-windows -Dwindows-self-hosted=true --summary all
      - name: Run full Windows test suite with native Zig codegen (ReleaseSafe)
        run: zig build -j1 test -Dtarget=x86_64-windows -Doptimize=ReleaseSafe -Dwindows-self-hosted=true --summary all
      - name: Build native-codegen Windows test runners
        run: zig build -j1 test-artifacts -Dtarget=x86_64-windows -Dwindows-self-hosted=true --summary all
      - name: Verify Windows test-runner stack reserves
        shell: pwsh
        run: |
          $names = @(
            'onyx-server-module-tests-crypto.exe',
            'onyx-server-module-tests-daemon.exe',
            'onyx-server-module-tests-proto.exe',
            'onyx-server-module-tests-substrate.exe',
            'onyx-server-module-tests-wasm.exe',
            'onyx-server-daemon-tests.exe',
            'onyx-server-cli-tests.exe'
          )
          foreach ($name in $names) {
            $path = Join-Path (Resolve-Path .\zig-out\bin) $name
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 60)
            $reserve = [BitConverter]::ToUInt64($bytes, $pe + 96)
            if ($reserve -ne 67108864) { throw "$name reserves $reserve bytes of stack" }
          }
      - name: Run portable protocol tests (Debug)
        run: zig build -j1 test-mod -Dtarget=x86_64-windows '-Dtest-filter=runtime capability policy' '-Dtest-filter=limited runtime welcome' --summary all
      - name: Run portable protocol tests (ReleaseSafe)
        run: zig build -j1 test-mod -Dtarget=x86_64-windows -Doptimize=ReleaseSafe '-Dtest-filter=runtime capability policy' '-Dtest-filter=limited runtime welcome' --summary all
      - name: Run full protocol module tests (Debug)
        run: zig build -j1 test-mod -Dtarget=x86_64-windows '-Dtest-filter=proto.' --summary all
      - name: Run native store module tests (Debug)
        run: zig build -j1 test-mod -Dtarget=x86_64-windows '-Dtest-filter=daemon.store.test.' --summary all
      - name: Run native store module tests (ReleaseSafe)
        run: zig build -j1 test-mod -Dtarget=x86_64-windows -Doptimize=ReleaseSafe '-Dtest-filter=daemon.store.test.' --summary all
      - name: Run complete native CLI tests (Debug)
        run: zig build -j1 test-cli -Dtarget=x86_64-windows --summary all
      - name: Run complete native CLI tests (ReleaseSafe)
        run: zig build -j1 test-cli -Dtarget=x86_64-windows -Doptimize=ReleaseSafe --summary all

  # Live fixtures build their own artifacts on a separate runner so the full
  # test suites and process smokes have independent time budgets.
  windows-smokes:
    name: native Windows live smokes
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify pinned Windows Zig
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://pkg.hexops.org/zig/zig-x86_64-windows-0.17.0-dev.1282+c0f9b51d8.zip'
          $expectedSha256 = 'DF1CA8156908BD51B417265773092DDF41A1D307F0E93B28BB3E8A0B912D0681'
          $archive = Join-Path $env:RUNNER_TEMP 'zig-pinned-windows.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'zig-pinned-windows'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Zig archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $zigExe = Get-ChildItem -LiteralPath $installRoot -Filter zig.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $zigExe) { throw 'Pinned Zig archive contains no zig.exe' }
          $actualVersion = (& $zigExe.FullName version).Trim()
          if ($actualVersion -ne $env:ZIG_VERSION) {
            throw "Zig version mismatch: expected $env:ZIG_VERSION, got $actualVersion"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $zigExe.DirectoryName
      - name: Build (debug)
        run: zig build -j1 -Dtarget=x86_64-windows --summary all
      - name: Build native-codegen Windows release package
        run: zig build -j1 package -Dtarget=x86_64-windows -Dwindows-self-hosted=true --prefix .\zig-out-selfhosted --summary all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke native-codegen Windows release package
        run: python -B .\tools\windows_full_daemon_smoke.py .\zig-out-selfhosted\bin\onyx-server.exe --tls --wss --metrics --webhook
      - name: Smoke packaged Windows quickstart
        run: python -B .\tools\windows_quickstart_smoke.py .\zig-out-selfhosted\bin\onyx-server.exe --template .\zig-out-selfhosted\etc\onyx-server\onyx-server.windows.quickstart.toml
      # The hosted Windows runner is disposable and elevated. The fixture
      # refuses installation if an exact-name service already exists.
      - name: Smoke real Windows SCM service and Helix lifecycle
        run: python -B .\tools\windows_scm_service_smoke.py .\zig-out-selfhosted\bin\onyx-server.exe --allow-service-install
      - name: Build native Windows QUIC interop tools
        run: zig build -j1 quic-interop-server quic-interop-wt-server -Dtarget=x86_64-windows -Dwindows-self-hosted=true --summary all
      - name: Run standalone Windows WebTransport browser interop
        run: python -B .\tools\windows_quic_interop_smoke.py .\zig-out\bin\quic_interop_wt_server.exe
      - name: Run native full-daemon IRC, TLS, WSS, metrics, and webhook smoke
        run: python -B .\tools\windows_full_daemon_smoke.py .\zig-out\bin\onyx-server.exe --tls --wss --metrics --webhook
      - name: Run shared IRC runtime contract on native Windows
        run: python -B .\tools\runtime_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run shipped Windows quickstart smoke
        run: python -B .\tools\windows_quickstart_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native plaintext WebSocket smoke
        run: python -B .\tools\windows_full_daemon_smoke.py .\zig-out\bin\onyx-server.exe --ws-plain
      - name: Run native PROXY protocol v1/v2 smoke
        run: python -B .\tools\windows_full_daemon_smoke.py .\zig-out\bin\onyx-server.exe --proxy
      - name: Run native account persistence and TLS SASL PLAIN smoke
        run: python -B .\tools\windows_full_daemon_smoke.py .\zig-out\bin\onyx-server.exe --tls --accounts
      - name: Run native stats publication and restart smoke
        run: python -B .\tools\windows_stats_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native STS advertisement and TLS smoke
        run: python -B .\tools\windows_sts_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native secured three-node mesh smoke
        run: python -B .\tools\windows_mesh_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native reusable-session and cold-reconnect smoke
        run: python -B .\tools\windows_session_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded native Windows Helix sequential upgrade smoke
        run: python -B .\tools\windows_helix_smoke.py .\zig-out\bin\onyx-server.exe
      # The smoke prints SKIP when no preferred assigned link-local IPv6 address exists.
      - name: Run scoped IPv6 Windows Helix listener smoke
        run: python -B .\tools\windows_helix_scoped_ipv6_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded Windows Helix with an inert native media port
        run: python -B .\tools\windows_helix_smoke.py .\zig-out\bin\onyx-server.exe --inert-native-port
      # This ancestor still speaks the v17 Windows Helix protocol. Build it
      # with the same pinned Zig so the refusal path cannot silently skip.
      - name: Check out incompatible Windows Helix v17 fixture
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: 1cd9c5040d7c08551b6a2c401973d842b64f0c17
          path: .ci/helix-v17
      - name: Build incompatible Windows Helix v17 fixture
        working-directory: .ci/helix-v17
        run: zig build -j1 package -Dtarget=x86_64-windows --summary all
      - name: Run guarded Windows Helix staged-image selection smoke
        run: python -B .\tools\windows_helix_candidate_path_smoke.py .\zig-out\bin\onyx-server.exe --incompatible-binary .\.ci\helix-v17\zig-out\bin\onyx-server.exe
      - name: Run Windows REHASH source-proof and Helix continuity smoke
        run: python -B .\tools\windows_helix_rehash_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Build automatic descriptor rollover smoke executable
        run: zig build -j1 windows-rollover-smoke-server -Dtarget=x86_64-windows --summary all
      - name: Run automatic Windows descriptor rollover process smoke
        run: python -B .\tools\windows_descriptor_rollover_smoke.py .\zig-out\bin\onyx-server-rollover-smoke.exe
      - name: Run guarded native Windows Helix TLS and WSS upgrade smoke
        run: python -B .\tools\windows_helix_tls_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded native Windows Helix generated TLS and WSS upgrade smoke
        run: python -B .\tools\windows_helix_tls_smoke.py .\zig-out\bin\onyx-server.exe --generated
      - name: Run Windows Helix TLS 1.3 ticket resumption smoke
        run: python -B .\tools\windows_helix_tls_smoke.py .\zig-out\bin\onyx-server.exe --resumption
      - name: Run Windows Helix TLS 1.3 early-data smoke
        run: python -B .\tools\windows_helix_tls_smoke.py .\zig-out\bin\onyx-server.exe --early-data
      - name: Run Windows Helix TLS 1.2 ticket resumption smoke
        run: python -B .\tools\windows_helix_tls_smoke.py .\zig-out\bin\onyx-server.exe --resumption-tls12
      - name: Run Windows Helix certificate rotation refusal smoke
        run: python -B .\tools\windows_helix_tls_smoke.py .\zig-out\bin\onyx-server.exe --negative rotation
      - name: Run Windows Helix failed certificate reload refusal smoke
        run: python -B .\tools\windows_helix_tls_smoke.py .\zig-out\bin\onyx-server.exe --negative failed-reload
      - name: Build native Windows TLS early-data smoke client
        run: zig build -j1 windows-helix-early-client -Dtarget=x86_64-windows -Dwindows-self-hosted=true --summary all
      - name: Run exact TLS early-data replay through Windows Helix
        run: python -B .\tools\windows_helix_early_data_smoke.py .\zig-out\bin\onyx-server.exe --exact-replay
      - name: Run guarded native Windows Helix metrics upgrade smoke
        run: python -B .\tools\windows_helix_metrics_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded native Windows Helix webhook upgrade smoke
        run: python -B .\tools\windows_helix_webhook_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded native Windows Helix secured mesh upgrade smoke
        run: python -B .\tools\windows_helix_mesh_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run sequential three-node Windows Helix session mesh smoke
        run: python -B .\tools\windows_helix_mesh_sequence_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded native Windows Helix OroWasm upgrade smoke
        run: python -B .\tools\windows_helix_wasm_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run Windows post-REHASH OroWasm Helix smoke
        run: python -B .\tools\windows_helix_wasm_smoke.py .\zig-out\bin\onyx-server.exe --rehash
      - name: Run guarded native Windows Helix Web Push upgrade smoke
        run: python -B .\tools\windows_webpush_helix_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded native Windows Helix geo policy upgrade smoke
        run: python -B .\tools\windows_geo_helix_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded native Windows Helix mail upgrade smoke
        run: python -B .\tools\windows_mail_helix_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run guarded native Windows Helix account flow upgrade smoke
        run: python -B .\tools\windows_account_flow_helix_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native three-shard plaintext TLS and WSS fanout smoke
        run: python -B .\tools\windows_multishard_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run private backup publication and restore smoke
        run: python -B .\tools\windows_backup_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run private Web Push VAPID boot and restart smoke
        run: python -B .\tools\windows_webpush_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run private OCG2 authority mode and restart smoke
        run: python -B .\tools\windows_ocg2_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native ACME and OCSP worker smoke
        run: python -B .\tools\windows_tls_companion_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Build native Windows OCSP handshake client
        run: zig build -j1 windows-ocsp-client -Dtarget=x86_64-windows -Dwindows-self-hosted=true --summary all
      - name: Run live Windows OCSP fetch and stapling smoke
        run: python -B .\tools\windows_ocsp_live_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native OroWasm plugin command smoke
        run: python -B .\tools\windows_wasm_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Build pure Zig Windows SMTP relay fixture
        run: zig build -j1 windows-mail-relay -Dtarget=x86_64-windows -Dwindows-self-hosted=true --summary all
      - name: Run native trusted SMTP delivery and failure journal smoke
        run: python -B .\tools\windows_mail_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native GeoIP and news cache smoke
        run: python -B .\tools\windows_geo_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native WebTransport browser IRC smoke
        run: python -B .\tools\windows_webtransport_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native QUIC, HTTP/3 and WebTransport debug-trace smoke
        run: python -B .\tools\windows_webtransport_smoke.py .\zig-out\bin\onyx-server.exe --debug-trace
      - name: Run native WebTransport two-swap Helix browser smoke
        run: python -B .\tools\windows_helix_webtransport_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native generated-certificate WebTransport Helix browser smoke
        run: python -B .\tools\windows_helix_webtransport_smoke.py .\zig-out\bin\onyx-server.exe --generated
      - name: Run active WebTransport session Helix browser smoke
        run: python -B .\tools\windows_helix_webtransport_smoke.py .\zig-out\bin\onyx-server.exe --active
      - name: Run native WebTransport browser to IPv6 IRC bind smoke
        run: python -B .\tools\windows_webtransport_smoke.py .\zig-out\bin\onyx-server.exe --ipv6-irc
      - name: Run native WebTransport browser to specific IPv4 IRC bind smoke
        run: python -B .\tools\windows_webtransport_smoke.py .\zig-out\bin\onyx-server.exe --irc-host 127.0.0.2
      - name: Run native media signaling and UDP forwarding smoke
        run: python -B .\tools\windows_media_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run native media two-swap Helix UDP smoke
        run: python -B .\tools\windows_helix_media_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run active native media and WebRTC Helix smoke
        run: python -B .\tools\windows_helix_media_smoke.py .\zig-out\bin\onyx-server.exe --active
      - name: Run active WebTransport and media combined Helix smoke
        run: python -B .\tools\windows_helix_combined_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Preserve active WebTransport and media across configured TLS cap REHASH
        run: python -B .\tools\windows_helix_combined_smoke.py .\zig-out\bin\onyx-server.exe --rehash-cap --rotate-active-refusal
      - name: Preserve active WebTransport and media across generated TLS cap REHASH
        run: python -B .\tools\windows_helix_combined_smoke.py .\zig-out\bin\onyx-server.exe --generated --rehash-cap
      - name: Run Windows cold console Ctrl+Break stop smoke
        run: python -B .\tools\windows_console_stop_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run Windows cold console Ctrl+C stop smoke
        run: python -B .\tools\windows_console_stop_smoke.py .\zig-out\bin\onyx-server.exe --ctrl-c
      - name: Run Windows post-Helix console Ctrl+Break stop smoke
        run: python -B .\tools\windows_console_stop_smoke.py .\zig-out\bin\onyx-server.exe --helix
      - name: Run Windows post-Helix console Ctrl+C stop smoke
        run: python -B .\tools\windows_console_stop_smoke.py .\zig-out\bin\onyx-server.exe --helix --ctrl-c
      - name: Run Windows SCM host and two-swap cooperative stop smoke
        run: python -B .\tools\windows_scm_smoke.py .\zig-out\bin\onyx-server.exe
      - name: Run Windows SCM host-loss containment smoke
        run: python -B .\tools\windows_scm_smoke.py .\zig-out\bin\onyx-server.exe --kill-host
      - name: Run Windows SCM invalid-config startup smoke
        run: python -B .\tools\windows_scm_smoke.py .\zig-out\bin\onyx-server.exe --invalid-config
      - name: Refuse foreground Windows SCM dispatch
        run: python -B .\tools\windows_scm_smoke.py .\zig-out\bin\onyx-server.exe --direct-scm
      - name: Run configured Windows security and listener failure smoke
        run: python -B .\tools\windows_startup_intent_smoke.py .\zig-out\bin\onyx-server.exe

  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Historical dev archives are preserved by this Zig community mirror.
      # The pinned SHA-256 below was verified against Zig's minisign key.
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          if [[ "${ZIG_VERSION}" == *"-dev."* ]]; then
            url="https://pkg.hexops.org/zig/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          else
            url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          fi
          archive="${GITHUB_WORKSPACE}/.ci/zig.tar.xz"
          install_root="${GITHUB_WORKSPACE}/.ci"
          mkdir -p "${install_root}"
          curl -fsSL "$url" -o "${archive}"
          printf '%s  %s\n' "$ZIG_LINUX_SHA256" "$archive" | sha256sum -c -
          tar -xf "${archive}" -C "${install_root}"
          test "$("${install_root}/zig-x86_64-linux-${ZIG_VERSION}/zig" version)" = "$ZIG_VERSION"
          echo "${install_root}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: Build (debug)
        run: zig build
      # The browser codec WASM step wires standalone module paths by hand, so a
      # file rename can break it while every native step still builds (this
      # exact break shipped once) — keep it in CI.
      - name: Build browser WASM modules
        run: zig build wasm
      # Debug catches safety checks and leak reports; ReleaseSafe catches codegen
      # and optimization-only regressions without making CI depend on ReleaseFast
      # runtime assertions.
      - name: Run ReleaseSafe smoke suites
        run: zig build test-smoke -Doptimize=ReleaseSafe --summary all
      # Threaded server tests need loopback sockets + io_uring; when a runner
      # lacks either the tests SkipZigTest rather than fail, so this stays green
      # on any hosted runner while exercising everything available.
      - name: Run focused smoke suites
        run: zig build test-smoke-verbose --summary all
      - name: Run deterministic assurance suite
        run: zig build all-checks-verbose --summary all

  bogo:
    name: external BoGo TLS interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig ${{ env.ZIG_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ZIG_VERSION}" == *"-dev."* ]]; then
            url="https://pkg.hexops.org/zig/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          else
            url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          fi
          archive="${GITHUB_WORKSPACE}/.ci/zig.tar.xz"
          install_dir="${GITHUB_WORKSPACE}/.ci/zig-${ZIG_VERSION}"
          mkdir -p "${GITHUB_WORKSPACE}/.ci"
          curl -fsSL "${url}" -o "${archive}"
          printf '%s  %s\n' "$ZIG_LINUX_SHA256" "$archive" | sha256sum -c -
          mkdir -p "${install_dir}"
          tar -xf "${archive}" -C "${install_dir}" --strip-components=1
          test "$("${install_dir}/zig" version)" = "$ZIG_VERSION"
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - uses: actions/setup-go@v5
        with:
          # The pinned BoringSSL go.mod requires this exact toolchain.
          go-version: "1.25.8"
          cache: false
      - name: Cache pinned runner and Go build state
        uses: actions/cache@v4
        with:
          path: |
            .bogo/boringssl
            ~/.cache/go-build
            ~/go/pkg/mod
          key: bogo-${{ runner.os }}-go1.25.8-5ac7567c234514157a504ff3fbedc0f5eddbf678
      - name: Verify shim self-test
        run: zig build bogo-shim-test --summary all
      - name: Force the ephemeral runner onto IPv4 loopback
        # BoringSSL prefers ::1 and adds -ipv6, while the bounded Onyx shim is
        # IPv4-only. This job owns its disposable VM, so disabling IPv6 here is
        # safer and more portable than relying on unprivileged user namespaces.
        run: sudo sysctl -q -w net.ipv6.conf.all.disable_ipv6=1
      - name: Run required external baseline
        env:
          BOGO_CACHE_DIR: ${{ github.workspace }}/.bogo
          BOGO_USE_IPV4_NETNS: "0"
          # The shim is intentionally serialized: concurrent external peers can
          # consume its bounded handshake deadline and turn valid cases into
          # scheduler-dependent timeouts on shared runners.
          BOGO_NUM_WORKERS: "1"
        run: tools/bogo.sh

  release:
    name: release build (x86_64-linux-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Historical dev archives are preserved by this Zig community mirror.
      # The pinned SHA-256 below was verified against Zig's minisign key.
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          if [[ "${ZIG_VERSION}" == *"-dev."* ]]; then
            url="https://pkg.hexops.org/zig/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          else
            url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          fi
          archive="${GITHUB_WORKSPACE}/.ci/zig.tar.xz"
          install_root="${GITHUB_WORKSPACE}/.ci"
          mkdir -p "${install_root}"
          curl -fsSL "$url" -o "${archive}"
          printf '%s  %s\n' "$ZIG_LINUX_SHA256" "$archive" | sha256sum -c -
          tar -xf "${archive}" -C "${install_root}"
          test "$("${install_root}/zig-x86_64-linux-${ZIG_VERSION}/zig" version)" = "$ZIG_VERSION"
          echo "${install_root}/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      # The static-musl ReleaseFast binary is the production artifact — verify it
      # links and produces a stripped executable on every change.
      - name: Build static musl release
        run: zig build release -Dtarget=x86_64-linux-musl
      - name: Verify artifact
        run: |
          file zig-out/bin/onyx-server
          test -x zig-out/bin/onyx-server
          # The daemon core embeds @tagName(builtin.mode) for its VERSION line —
          # exactly one mode string ends up in the binary. Assert the core is
          # really ReleaseFast: a mis-wired build graph once shipped a "release"
          # shim wrapping a Debug core, and this catches that structurally.
          grep -aq ReleaseFast zig-out/bin/onyx-server
          ! grep -aq Debug zig-out/bin/onyx-server
      - name: Upload daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: onyx-server-x86_64-linux-musl
          path: zig-out/bin/onyx-server
          if-no-files-found: error
          retention-days: 14
